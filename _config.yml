# Site settings
title: Andreas Brekken
tagline: Coder, founder SideShift.ai & Shitcoin.com
description: >-
  Personal website of Andreas Brekken. Coder, Founder SideShift.ai & Shitcoin.com. Prev Kraken.com, Justcoin.com

url: "https://abrkn.github.io"
baseurl: ""

# Author
author:
  name: Andreas Brekken
  email: andreas@brekken.com
  avatar: /assets/img/andreas-brekken.jpg

# Social links
social:
  github: abrkn
  twitter: abrkn
  instagram: abrkn
  email: andreas@brekken.com

# Build settings
theme: minima
markdown: kramdown
highlighter: rouge

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-gist

# Permalink structure
permalink: /posts/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Exclude from build
exclude:
  - "*.gem"
  - "*.gemspec"
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - _site
