<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet">

  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/img/favicon/favicon-96x96.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  {% seo %}

</head>
<body>
  <div class="container">
    <header class="site-header">
      <div class="hero">
        <a href="{{ '/' | relative_url }}" class="avatar-link"><img src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }}" class="avatar"></a>
        <div class="hero-text">
          <h1><a href="{{ '/' | relative_url }}">Andreas Brekken</a></h1>
          <p class="tagline">{{ site.tagline }}</p>
        </div>
      </div>
      <nav class="nav">
        <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' or page.layout == 'post' %}active{% endif %}">Posts</a>
        <a href="{{ '/about' | relative_url }}" class="nav-link {% if page.url == '/about/' %}active{% endif %}">About</a>
        <a href="{{ '/media' | relative_url }}" class="nav-link {% if page.url == '/media/' %}active{% endif %}">Media</a>
      </nav>
    </header>

    <main class="content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="social-links">
        <a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="https://twitter.com/{{ site.social.twitter }}" target="_blank" rel="noopener">X</a>
        <a href="https://instagram.com/{{ site.social.instagram }}" target="_blank" rel="noopener">Instagram</a>
        <a href="https://{{ site.social.substack }}" target="_blank" rel="noopener">Substack</a>
        <a href="#" class="email-link">Email</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </div>
      <p class="copyright">&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
    </footer>
  </div>

  <script>
    // Email is rot13'd so the plain address never appears in the HTML source.
    // Harvesters that regex the markup for an address find nothing.
    (function () {
      var e = 'naqernf@oerxxra.pbz'.replace(/[a-z]/g, function (c) {
        return String.fromCharCode((c.charCodeAt(0) - 97 + 13) % 26 + 97);
      });
      var a = document.querySelector('.email-link');
      if (a) { a.href = 'mailto:' + e; a.title = e; }
    })();
  </script>
</body>
</html>
